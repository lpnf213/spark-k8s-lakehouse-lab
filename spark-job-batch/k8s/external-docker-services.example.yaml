apiVersion: v1
kind: Service
metadata:
  name: app-store-postgres
  namespace: spark-jobs
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: app-store-postgres
  namespace: spark-jobs
subsets:
  - addresses:
      - ip: 192.168.31.1
    ports:
      - name: postgres
        port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: spark-jobs
spec:
  ports:
    - name: api
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: minio
  namespace: spark-jobs
subsets:
  - addresses:
      - ip: 192.168.31.1
    ports:
      - name: api
        port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: hive-metastore
  namespace: spark-jobs
spec:
  ports:
    - name: thrift
      port: 9083
      targetPort: 9083
---
apiVersion: v1
kind: Endpoints
metadata:
  name: hive-metastore
  namespace: spark-jobs
subsets:
  - addresses:
      - ip: 192.168.31.1
    ports:
      - name: thrift
        port: 9083
