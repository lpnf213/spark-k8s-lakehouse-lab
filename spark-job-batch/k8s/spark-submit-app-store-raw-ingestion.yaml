apiVersion: batch/v1
kind: Job
metadata:
  name: spark-submit-app-store-raw-ingestion
  namespace: spark-jobs
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: spark-submit-app-store-raw-ingestion
    spec:
      serviceAccountName: spark
      restartPolicy: Never
      containers:
        - name: spark-submit
          image: 192.168.31.1:5000/spark-job-batch:0.1.3
          imagePullPolicy: IfNotPresent
          command:
            - /opt/spark/bin/spark-submit
          args:
            - --master
            - k8s://https://kubernetes.default.svc
            - --deploy-mode
            - cluster
            - --name
            - app-store-raw-ingestion
            - --class
            - com.example.spark.operations.batch.AppStoreRawIngestionJob
            - --conf
            - spark.kubernetes.namespace=spark-jobs
            - --conf
            - spark.kubernetes.authenticate.submission.oauthTokenFile=/var/run/secrets/kubernetes.io/serviceaccount/token
            - --conf
            - spark.kubernetes.authenticate.submission.caCertFile=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - --conf
            - spark.kubernetes.authenticate.driver.serviceAccountName=spark
            - --conf
            - spark.kubernetes.container.image=192.168.31.1:5000/spark-job-batch:0.1.3
            - --conf
            - spark.kubernetes.container.image.pullPolicy=IfNotPresent
            - --conf
            - spark.dynamicAllocation.enabled=true
            - --conf
            - spark.dynamicAllocation.shuffleTracking.enabled=true
            - --conf
            - spark.dynamicAllocation.initialExecutors=1
            - --conf
            - spark.dynamicAllocation.minExecutors=1
            - --conf
            - spark.dynamicAllocation.maxExecutors=10
            - --conf
            - spark.dynamicAllocation.executorIdleTimeout=60s
            - --conf
            - spark.executor.cores=1
            - --conf
            - spark.executor.memory=1g
            - --conf
            - spark.driver.memory=1g
            - --conf
            - spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
            - --conf
            - spark.sql.catalog.lakehouse=org.apache.iceberg.spark.SparkCatalog
            - --conf
            - spark.sql.catalog.lakehouse.type=hive
            - --conf
            - spark.sql.catalog.lakehouse.uri=thrift://hive-metastore.spark-jobs.svc.cluster.local:9083
            - --conf
            - spark.sql.catalog.lakehouse.warehouse=s3a://warehouse/
            - --conf
            - spark.hadoop.fs.s3a.endpoint=http://minio.spark-jobs.svc.cluster.local:9000
            - --conf
            - spark.hadoop.fs.s3a.access.key=minioadmin
            - --conf
            - spark.hadoop.fs.s3a.secret.key=minioadmin
            - --conf
            - spark.hadoop.fs.s3a.path.style.access=true
            - --conf
            - spark.hadoop.fs.s3a.connection.ssl.enabled=false
            - --conf
            - spark.kubernetes.driverEnv.APPSTORE_JDBC_URL=jdbc:postgresql://app-store-postgres.spark-jobs.svc.cluster.local:5432/appstore
            - --conf
            - spark.kubernetes.driverEnv.APPSTORE_JDBC_USER=appstore
            - --conf
            - spark.kubernetes.driverEnv.APPSTORE_JDBC_PASSWORD=appstore
            - --conf
            - spark.kubernetes.driverEnv.ICEBERG_CATALOG=lakehouse
            - --conf
            - spark.kubernetes.driverEnv.ICEBERG_RAW_DATABASE=raw_app_store
            - --conf
            - spark.kubernetes.driverEnv.INGESTION_MODE=delta_append
            - --conf
            - spark.kubernetes.driverEnv.JDBC_PARTITIONS=8
            - --conf
            - spark.kubernetes.driverEnv.APPSTORE_USERS_UPPER_BOUND=100000
            - --conf
            - spark.kubernetes.driverEnv.APPSTORE_APPS_UPPER_BOUND=5000
            - --conf
            - spark.kubernetes.driverEnv.APPSTORE_SUBSCRIPTIONS_UPPER_BOUND=100000
            - --conf
            - spark.executorEnv.APPSTORE_JDBC_URL=jdbc:postgresql://app-store-postgres.spark-jobs.svc.cluster.local:5432/appstore
            - --conf
            - spark.executorEnv.APPSTORE_JDBC_USER=appstore
            - --conf
            - spark.executorEnv.APPSTORE_JDBC_PASSWORD=appstore
            - --conf
            - spark.executorEnv.ICEBERG_CATALOG=lakehouse
            - --conf
            - spark.executorEnv.ICEBERG_RAW_DATABASE=raw_app_store
            - --conf
            - spark.executorEnv.INGESTION_MODE=delta_append
            - local:///opt/spark/app/spark-job-batch.jar
