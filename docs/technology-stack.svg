<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Spark on Kubernetes Lakehouse Technology Stack</title>
  <desc id="desc">Technology stack showing PostgreSQL, Spark on Kubernetes, Iceberg, MinIO, Hive Metastore, Trino, Docker, Vagrant, and study topics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.5" stop-color="#172554"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 800 42px Inter, Segoe UI, Arial, sans-serif; fill: #F8FAFC; }
      .subtitle { font: 500 18px Inter, Segoe UI, Arial, sans-serif; fill: #CBD5E1; }
      .lane { font: 800 18px Inter, Segoe UI, Arial, sans-serif; fill: #E0F2FE; letter-spacing: .08em; }
      .box-title { font: 800 24px Inter, Segoe UI, Arial, sans-serif; fill: #F8FAFC; }
      .box-text { font: 500 15px Inter, Segoe UI, Arial, sans-serif; fill: #DDEAFE; }
      .pill { font: 700 14px Inter, Segoe UI, Arial, sans-serif; fill: #0F172A; }
      .arrow { stroke: #93C5FD; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#93C5FD"/>
    </marker>
  </defs>

  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="170" fill="#38BDF8" opacity="0.12"/>
  <circle cx="110" cy="600" r="210" fill="#A78BFA" opacity="0.13"/>

  <text x="60" y="70" class="title">Spark on Kubernetes Lakehouse Lab</text>
  <text x="62" y="105" class="subtitle">A study environment for batch ingestion, Iceberg tables, object storage, metadata catalogs, and SQL analytics.</text>

  <text x="70" y="170" class="lane">SOURCE</text>
  <text x="335" y="170" class="lane">COMPUTE</text>
  <text x="660" y="170" class="lane">LAKEHOUSE</text>
  <text x="965" y="170" class="lane">QUERY</text>

  <g filter="url(#shadow)">
    <rect x="55" y="200" width="230" height="170" rx="24" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="85" y="245" class="box-title">PostgreSQL</text>
    <text x="85" y="278" class="box-text">Operational App Store DB</text>
    <text x="85" y="304" class="box-text">users, apps, subscriptions</text>
    <rect x="85" y="325" width="142" height="30" rx="15" fill="#BAE6FD"/>
    <text x="105" y="345" class="pill">JDBC source</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="350" y="200" width="260" height="170" rx="24" fill="#1E293B" stroke="#FB923C" stroke-width="2"/>
    <text x="380" y="245" class="box-title">Apache Spark</text>
    <text x="380" y="278" class="box-text">Scala batch job</text>
    <text x="380" y="304" class="box-text">driver + dynamic executors</text>
    <rect x="380" y="325" width="170" height="30" rx="15" fill="#FED7AA"/>
    <text x="402" y="345" class="pill">Spark on K8s</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="675" y="190" width="230" height="105" rx="24" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
    <text x="705" y="235" class="box-title">Iceberg</text>
    <text x="705" y="268" class="box-text">ACID table format</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="675" y="320" width="230" height="105" rx="24" fill="#1E293B" stroke="#34D399" stroke-width="2"/>
    <text x="705" y="365" class="box-title">MinIO</text>
    <text x="705" y="398" class="box-text">S3-compatible warehouse</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="675" y="450" width="230" height="105" rx="24" fill="#1E293B" stroke="#A78BFA" stroke-width="2"/>
    <text x="705" y="495" class="box-title">Hive Metastore</text>
    <text x="705" y="528" class="box-text">Iceberg catalog metadata</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="960" y="255" width="190" height="170" rx="24" fill="#1E293B" stroke="#F472B6" stroke-width="2"/>
    <text x="990" y="300" class="box-title">Trino</text>
    <text x="990" y="333" class="box-text">SQL over Iceberg</text>
    <text x="990" y="359" class="box-text">CLI or DBeaver</text>
    <rect x="990" y="380" width="105" height="30" rx="15" fill="#FBCFE8"/>
    <text x="1012" y="400" class="pill">Analytics</text>
  </g>

  <path class="arrow" d="M290 285 C315 285, 325 285, 345 285"/>
  <path class="arrow" d="M615 285 C640 270, 650 245, 670 242"/>
  <path class="arrow" d="M615 305 C640 340, 650 370, 670 372"/>
  <path class="arrow" d="M615 325 C640 420, 650 500, 670 502"/>
  <path class="arrow" d="M910 372 C930 372, 940 350, 955 340"/>

  <g filter="url(#shadow)">
    <rect x="115" y="490" width="470" height="105" rx="24" fill="#0F172A" stroke="#64748B" stroke-width="2"/>
    <text x="145" y="532" class="box-title">Local platform</text>
    <text x="145" y="565" class="box-text">Docker Compose runs PostgreSQL, MinIO, Hive Metastore, and Trino.</text>
    <text x="145" y="590" class="box-text">Vagrant + kubeadm runs the Kubernetes cluster used by Spark.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="675" y="595" width="475" height="58" rx="22" fill="#E0F2FE"/>
    <text x="705" y="632" class="pill">Study path: full load → delta merge → partitioning → scaling → observability → data quality</text>
  </g>
</svg>
