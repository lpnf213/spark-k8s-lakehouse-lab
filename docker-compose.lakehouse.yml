services:
  minio:
    image: minio/minio:latest
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      lakehouse-net:
        ipv4_address: 172.28.10.10
    volumes:
      - lakehouse-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      lakehouse-net:
    entrypoint: >
      /bin/sh -c "
      mc alias set lakehouse http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing lakehouse/warehouse;
      mc mb --ignore-existing lakehouse/spark-events;
      mc version enable lakehouse/warehouse;
      "

  hive-metastore-db:
    image: postgres:16
    container_name: lakehouse-hive-metastore-db
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    ports:
      - "5433:5432"
    networks:
      lakehouse-net:
        ipv4_address: 172.28.10.20
    volumes:
      - lakehouse-hive-metastore-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 10

  hive-metastore:
    build:
      context: ./docker/hive-metastore
    container_name: lakehouse-hive-metastore
    depends_on:
      hive-metastore-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      METASTORE_DB_HOST: hive-metastore-db
      METASTORE_DB_PORT: 5432
      METASTORE_DB_NAME: metastore
      METASTORE_DB_USER: hive
      METASTORE_DB_PASSWORD: hive
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    ports:
      - "9083:9083"
    networks:
      lakehouse-net:
        ipv4_address: 172.28.10.30

  trino:
    image: trinodb/trino:481
    container_name: lakehouse-trino
    depends_on:
      hive-metastore:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      lakehouse-net:
        ipv4_address: 172.28.10.40
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog:ro

volumes:
  lakehouse-minio-data:
  lakehouse-hive-metastore-db-data:

networks:
  lakehouse-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
