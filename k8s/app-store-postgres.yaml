apiVersion: v1
kind: Namespace
metadata:
  name: app-store
---
apiVersion: v1
kind: Secret
metadata:
  name: app-store-postgres-secret
  namespace: app-store
type: Opaque
stringData:
  POSTGRES_DB: appstore
  POSTGRES_USER: appstore
  POSTGRES_PASSWORD: appstore
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-store-postgres-init
  namespace: app-store
data:
  01_schema.sql: |
    \set ON_ERROR_STOP on

    CREATE TABLE users (
        user_id BIGINT PRIMARY KEY,
        country_code CHAR(2) NOT NULL,
        device_type TEXT NOT NULL,
        created_at TIMESTAMPTZ NOT NULL,
        marketing_channel TEXT NOT NULL
    );

    CREATE TABLE app_categories (
        category_id INTEGER PRIMARY KEY,
        category_name TEXT NOT NULL UNIQUE
    );

    CREATE TABLE apps (
        app_id BIGINT PRIMARY KEY,
        category_id INTEGER NOT NULL REFERENCES app_categories(category_id),
        developer_name TEXT NOT NULL,
        app_name TEXT NOT NULL,
        price NUMERIC(8, 2) NOT NULL,
        created_at TIMESTAMPTZ NOT NULL,
        is_active BOOLEAN NOT NULL
    );

    CREATE TABLE app_downloads (
        download_id BIGINT PRIMARY KEY,
        user_id BIGINT NOT NULL REFERENCES users(user_id),
        app_id BIGINT NOT NULL REFERENCES apps(app_id),
        downloaded_at TIMESTAMPTZ NOT NULL,
        country_code CHAR(2) NOT NULL,
        device_type TEXT NOT NULL,
        app_version TEXT NOT NULL
    );

    CREATE TABLE app_reviews (
        review_id BIGINT PRIMARY KEY,
        user_id BIGINT NOT NULL REFERENCES users(user_id),
        app_id BIGINT NOT NULL REFERENCES apps(app_id),
        rating INTEGER NOT NULL CHECK (rating BETWEEN 1 AND 5),
        review_text TEXT,
        reviewed_at TIMESTAMPTZ NOT NULL
    );

    CREATE TABLE app_purchases (
        purchase_id BIGINT PRIMARY KEY,
        user_id BIGINT NOT NULL REFERENCES users(user_id),
        app_id BIGINT NOT NULL REFERENCES apps(app_id),
        purchased_at TIMESTAMPTZ NOT NULL,
        amount NUMERIC(10, 2) NOT NULL,
        currency CHAR(3) NOT NULL,
        payment_status TEXT NOT NULL
    );

    CREATE TABLE subscriptions (
        subscription_id BIGINT PRIMARY KEY,
        user_id BIGINT NOT NULL REFERENCES users(user_id),
        app_id BIGINT NOT NULL REFERENCES apps(app_id),
        started_at TIMESTAMPTZ NOT NULL,
        ended_at TIMESTAMPTZ,
        plan_type TEXT NOT NULL,
        status TEXT NOT NULL
    );

    CREATE INDEX idx_users_created_at ON users(created_at);
    CREATE INDEX idx_apps_category_id ON apps(category_id);
    CREATE INDEX idx_downloads_downloaded_at ON app_downloads(downloaded_at);
    CREATE INDEX idx_downloads_user_id ON app_downloads(user_id);
    CREATE INDEX idx_downloads_app_id ON app_downloads(app_id);
    CREATE INDEX idx_reviews_app_id_reviewed_at ON app_reviews(app_id, reviewed_at);
    CREATE INDEX idx_purchases_purchased_at ON app_purchases(purchased_at);
    CREATE INDEX idx_subscriptions_status ON subscriptions(status);
  02_seed_app_store_volume.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    USERS="${APP_STORE_USERS:-100000}"
    APPS="${APP_STORE_APPS:-5000}"
    DOWNLOADS="${APP_STORE_DOWNLOADS:-1000000}"
    REVIEWS="${APP_STORE_REVIEWS:-250000}"
    PURCHASES="${APP_STORE_PURCHASES:-300000}"
    SUBSCRIPTIONS="${APP_STORE_SUBSCRIPTIONS:-100000}"

    psql -v ON_ERROR_STOP=1 \
      -v users="${USERS}" \
      -v apps="${APPS}" \
      -v downloads="${DOWNLOADS}" \
      -v reviews="${REVIEWS}" \
      -v purchases="${PURCHASES}" \
      -v subscriptions="${SUBSCRIPTIONS}" \
      --username "${POSTGRES_USER}" \
      --dbname "${POSTGRES_DB}" <<'SQL'
    SET synchronous_commit = off;

    INSERT INTO app_categories (category_id, category_name)
    VALUES
        (1, 'Games'),
        (2, 'Productivity'),
        (3, 'Finance'),
        (4, 'Health'),
        (5, 'Education'),
        (6, 'Social'),
        (7, 'Shopping'),
        (8, 'Travel'),
        (9, 'Music'),
        (10, 'News');

    INSERT INTO users (user_id, country_code, device_type, created_at, marketing_channel)
    SELECT
        id,
        (ARRAY['US','PT','BR','GB','DE','FR','ES','IT','NL','CA'])[1 + (random() * 9)::int],
        (ARRAY['ios','android','tablet'])[1 + (random() * 2)::int],
        now() - (random() * interval '730 days'),
        (ARRAY['organic','paid_search','social','referral','email'])[1 + (random() * 4)::int]
    FROM generate_series(1, :users) AS id;

    INSERT INTO apps (app_id, category_id, developer_name, app_name, price, created_at, is_active)
    SELECT
        id,
        1 + (random() * 9)::int,
        'Developer ' || (1 + (random() * 500)::int),
        'App Store Demo App ' || id,
        CASE WHEN random() < 0.70 THEN 0 ELSE round((random() * 49.99)::numeric, 2) END,
        now() - (random() * interval '1095 days'),
        random() > 0.05
    FROM generate_series(1, :apps) AS id;

    INSERT INTO app_downloads (download_id, user_id, app_id, downloaded_at, country_code, device_type, app_version)
    SELECT
        id,
        1 + (random() * (:users - 1))::bigint,
        1 + (random() * (:apps - 1))::bigint,
        now() - (random() * interval '365 days'),
        (ARRAY['US','PT','BR','GB','DE','FR','ES','IT','NL','CA'])[1 + (random() * 9)::int],
        (ARRAY['ios','android','tablet'])[1 + (random() * 2)::int],
        (1 + (random() * 4)::int) || '.' || (random() * 10)::int || '.' || (random() * 20)::int
    FROM generate_series(1, :downloads) AS id;

    INSERT INTO app_reviews (review_id, user_id, app_id, rating, review_text, reviewed_at)
    SELECT
        id,
        1 + (random() * (:users - 1))::bigint,
        1 + (random() * (:apps - 1))::bigint,
        1 + (random() * 4)::int,
        CASE WHEN random() < 0.20 THEN NULL ELSE 'Synthetic review ' || id END,
        now() - (random() * interval '365 days')
    FROM generate_series(1, :reviews) AS id;

    INSERT INTO app_purchases (purchase_id, user_id, app_id, purchased_at, amount, currency, payment_status)
    SELECT
        id,
        1 + (random() * (:users - 1))::bigint,
        1 + (random() * (:apps - 1))::bigint,
        now() - (random() * interval '365 days'),
        round((0.99 + random() * 199.00)::numeric, 2),
        (ARRAY['USD','EUR','GBP','BRL','CAD'])[1 + (random() * 4)::int],
        (ARRAY['completed','failed','refunded','cancelled'])[1 + (random() * 3)::int]
    FROM generate_series(1, :purchases) AS id;

    INSERT INTO subscriptions (subscription_id, user_id, app_id, started_at, ended_at, plan_type, status)
    SELECT
        id,
        1 + (random() * (:users - 1))::bigint,
        1 + (random() * (:apps - 1))::bigint,
        now() - (random() * interval '365 days'),
        CASE WHEN random() < 0.75 THEN NULL ELSE now() - (random() * interval '180 days') END,
        (ARRAY['monthly','annual','trial'])[1 + (random() * 2)::int],
        (ARRAY['active','cancelled','expired'])[1 + (random() * 2)::int]
    FROM generate_series(1, :subscriptions) AS id;

    ANALYZE;
    SQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-store-postgres
  namespace: app-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-store-postgres
  template:
    metadata:
      labels:
        app: app-store-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: app-store-postgres-secret
          env:
            - name: APP_STORE_USERS
              value: "100000"
            - name: APP_STORE_APPS
              value: "5000"
            - name: APP_STORE_DOWNLOADS
              value: "1000000"
            - name: APP_STORE_REVIEWS
              value: "250000"
            - name: APP_STORE_PURCHASES
              value: "300000"
            - name: APP_STORE_SUBSCRIPTIONS
              value: "100000"
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - appstore
                - -d
                - appstore
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-data
          emptyDir: {}
        - name: postgres-init
          configMap:
            name: app-store-postgres-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: app-store-postgres
  namespace: app-store
spec:
  selector:
    app: app-store-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
